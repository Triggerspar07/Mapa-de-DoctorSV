name: Fix Leaflet map snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          for i, line in enumerate(lines):
              if '<div id="mapa"' in line and 'leaflet-container' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + '<div id="mapa"></div>'
                  break
          else:
              raise SystemExit('No se encontró el snapshot Leaflet dentro de #mapa')

          text = '\n'.join(lines) + '\n'
          text = text.replace(
              'href="./Red Nacional de Servicios Doctor SV · Mapa Interactivo antes de actu_files/leaflet.min.css"',
              'href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"'
          )
          text = text.replace(
              '<script src="./Red Nacional de Servicios Doctor SV · Mapa Interactivo antes de actu_files/leaflet.min.js.descarga"></script>',
              '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>'
          )
          text = text.replace(
              "mapa = L.map('mapa', {\n    zoomControl:false,",
              "mapa = L.map('mapa', {\n    zoomControl:false,\n    dragging:true,"
          )
          path.write_text(text, encoding='utf-8')

      - name: Commit repaired map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A .github/workflows/fix-map.yml
          git rm -f .github/workflows/fix-map.yml
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "Fix Leaflet map initialization and assets"
          git push
